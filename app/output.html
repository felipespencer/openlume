<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Projecionista — saída</title>
<style>
  html,body{ margin:0; height:100%; background:#000; overflow:hidden; cursor:none; }
  video{ position:absolute; left:0; top:0; width:100%; height:100%; object-fit:contain; display:block; background:#000; transform-origin:0 0; }
  video.mapped{ object-fit:fill; background:none; }
</style>
</head>
<body>
<video id="v" autoplay muted playsinline></video>
<script src="map.js"></script>
<script>
  // A saída não mistura nada: mostra a imagem que a janela de controle já misturou, e aplica
  // o mapeamento de quatro cantos que o controle definiu.
  var v = document.getElementById('v'), ultimo = '';
  function liga(){
    try{
      var s = window.opener && window.opener.__projStream;
      if(s && v.srcObject !== s){ v.srcObject = s; v.play().catch(function(){}); }
    }catch(e){}
  }
  liga(); setInterval(liga, 1000);
  (function quadro(){
    try{
      var m = window.opener && window.opener.__projMap;
      var chave = m ? JSON.stringify(m) + innerWidth + 'x' + innerHeight : '';
      if(chave !== ultimo){
        ultimo = chave;
        if(!m || projMapIsIdentity(m)){ v.classList.remove('mapped'); v.style.transform = ''; }
        else {
          var W = innerWidth, H = innerHeight;
          v.classList.add('mapped');
          v.style.transform = projHomography(W, H, m.map(function(p){ return [p[0] * W, p[1] * H]; }));
        }
      }
    }catch(e){}
    requestAnimationFrame(quadro);
  })();
  // F ou duplo clique: tela cheia. Esc sai.
  function cheia(){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function(){}); }
  addEventListener('keydown', function(e){ if(e.key === 'f' || e.key === 'F') cheia(); });
  addEventListener('dblclick', cheia);
</script>
</body>
</html>
