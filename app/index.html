<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' blob: data:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'">
<title>OpenLume</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="top">
    <span class="logo">OPEN<b>LUME</b></span>
    <div id="menubar"></div>
    <span id="compName" class="st"></span>
    <span id="fpsBox" class="st" hidden></span>
    <span class="sp"></span>
    <button id="btnLaser" type="button" title="LaserCube: desenhar, escrever e mandar SVG para o laser">Laser</button>
    <span id="midiState" class="st" title="Akai APC40 mkII: o programa acha sozinho quando o cabo está ligado"></span>
    <span id="outState" class="st">saída fechada</span>
    <button id="btnOut" type="button" title="Abre uma janela de saída por tela. Com um projetor ligado, ela já abre nele em tela cheia.">Abrir saída</button>
  </div>

  <div id="mid">
    <div id="gridCol">
      <div id="gridWrap"><div id="grid"></div></div>
      <div id="bpmBar" title="Relógio de BPM: tudo que anima na batida segue este relógio"></div>
      <div id="xfade" title="Crossfader: as camadas e grupos no bus A ficam à esquerda, as do bus B à direita"></div>
      <div id="decks" title="Decks: cada um guarda os seus clipes; as camadas são as mesmas"></div>
    </div>
    <div class="split v" id="splitMon" title="Arraste para mudar o tamanho; duplo clique volta ao padrão"></div>
    <div id="mons">
      <div class="mon out"><div class="cap"><span>Composição <i id="compInfo"></i></span><span class="acts"><button id="btnAO" type="button" title="Telas, slices, deformação, soft edge e máscaras: como a composição vai para cada projetor">Saída avançada</button></span></div><div class="scr" id="outScr"></div></div>
      <div class="mon"><div class="cap"><span>Prévia</span><span id="prevName">—</span></div><div class="scr" id="prevScr"></div></div>
      <div class="mon"><div class="cap"><span>Telas</span><span id="scrCount"></span></div><div id="scrList" class="saidas"></div></div>
    </div>
  </div>

  <div class="split h" id="splitBot" title="Arraste para mudar o tamanho; duplo clique volta ao padrão"></div>
  <div id="bot">
    <div class="pan rpan"><div class="ptabs" id="leftTabs"><span data-tab="comp" class="on">Composição</span><span data-tab="layer">Camada</span><span data-tab="group" hidden>Grupo</span></div><div class="ptitle" id="leftTitle"></div><div class="pbody rprops" id="leftPan"></div></div>
    <div class="split v" id="splitL"></div>
    <div class="pan rpan"><div class="ptabs"><span class="on">Clipe</span></div><div class="ptitle" id="clipTitle"></div><div class="pbody rprops" id="clipPan"></div></div>
    <div class="split v" id="splitR"></div>
    <div class="pan rpan"><div class="ptabs" id="browserTabs"><span data-tab="files" class="on">Arquivos</span><span data-tab="comps">Composições</span><span data-tab="fx">Efeitos</span><span data-tab="src">Fontes</span><span data-tab="rec">Gravar</span></div><div class="pbody browser" id="browserPan"></div><div class="help" id="browserHelp"><div class="hh">Ajuda</div><div class="hb">Passe o mouse sobre um item para saber o que ele faz.</div></div></div>
  </div>
  <div id="toast"></div>
  <div id="ao" hidden></div>
  <div id="lz" hidden></div>
  <script src="vendor/ort/ort.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
